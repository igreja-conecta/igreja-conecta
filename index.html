<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- De onde o app pode carregar código, estilos, imagens e dados. Se um texto vindo do banco
       tentasse virar código, o navegador não rodaria (o app já trata os textos com esc()). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://lmukzyonnggwwwjrfywy.supabase.co https://tile.openstreetmap.org; connect-src 'self' https://lmukzyonnggwwwjrfywy.supabase.co wss://lmukzyonnggwwwjrfywy.supabase.co https://nominatim.openstreetmap.org https://cdn.jsdelivr.net; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- igreja -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Igreja Conecta</title>
  <meta name="description" content="Agenda, avisos e aniversariantes da sua igreja, no celular.">
  <meta name="theme-color" content="#3b5bdb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Igreja Conecta">
  <link rel="stylesheet" href="css/style.css">
  <!-- Abre as conexões e pede os arquivos do app de uma vez, em vez de um depois do outro.
       O endereço do Supabase é o mesmo de js/config.js. -->
  <link rel="preconnect" href="https://lmukzyonnggwwwjrfywy.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/util.js">
  <link rel="modulepreload" href="js/images.js">
  <link rel="modulepreload" href="js/install.js">
  <link rel="modulepreload" href="js/push.js">
  <link rel="modulepreload" href="js/pix.js">
  <link rel="modulepreload" href="js/map.js">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <img id="brand-logo" src="icons/icon-192.png" alt="" width="30" height="30">
      <span id="app-name">Igreja Conecta</span>
    </a>
    <div class="top-actions">
      <a href="#/notificacoes" id="notif-link" class="notif-link" aria-label="Notificações" hidden>
        <svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
        <span id="notif-badge" class="notif-badge" hidden></span>
      </a>
      <a href="#/entrar" id="account-link" class="account-link">Entrar</a>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite">
    <div class="loading">Carregando…</div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Navegação principal" hidden></nav>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
