name: Publicar funções do Supabase

# Publica as Edge Functions (supabase/functions) e grava nelas as chaves que já existem nos
# segredos do GitHub. Segredo novo usado só aqui: SUPABASE_ACCESS_TOKEN (Supabase > Account >
# Access Tokens). Nenhum deles aparece no site.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/funcoes.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funcoes

env:
  PROJECT_REF: lmukzyonnggwwwjrfywy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Confere os segredos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta o segredo SUPABASE_ACCESS_TOKEN no GitHub. As funções não foram publicadas."
            exit 0
          fi
          echo "ok=1" >> "$GITHUB_ENV"
      - name: Guarda as chaves nas funções
        if: env.ok == '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          ENVIO_SECRET: ${{ secrets.ENVIO_SECRET }}
        run: |
          # Notificações do chat: as mesmas chaves dos lembretes.
          supabase secrets set --project-ref "$PROJECT_REF" VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" ENVIO_SECRET="$ENVIO_SECRET" > /dev/null
      - name: Publica as funções
        if: env.ok == '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for f in enviar-push; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
