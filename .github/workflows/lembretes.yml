name: Lembretes da agenda e avisos

on:
  schedule:
    # A cada 10 minutos. O GitHub às vezes atrasa alguns minutos.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lembretes

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save --no-audit --no-fund --no-package-lock web-push@3.6.7
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node scripts/enviar-lembretes.mjs
        env:
          SITE_URL: https://igreja-conecta.github.io/igreja-conecta
          ENVIO_SECRET: ${{ secrets.ENVIO_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
