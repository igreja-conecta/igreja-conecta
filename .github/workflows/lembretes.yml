name: Lembretes da agenda, avisos e inscrições

on:
  schedule:
    # A cada 10 minutos (reserva: quem chama na hora certa é o relógio do Supabase, 007_relogio.sql).
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lembretes

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save --no-audit --no-fund --no-package-lock web-push@3.6.7 nodemailer@6.10.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node scripts/enviar-lembretes.mjs
        env:
          SITE_URL: https://igreja-conecta.github.io/igreja-conecta
          ENVIO_SECRET: ${{ secrets.ENVIO_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # E-mail de confirmação das inscrições: o mesmo Gmail dos aniversários (sem eles, só o aviso no app).
          GMAIL_USER: ${{ vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
