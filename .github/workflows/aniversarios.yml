name: Mensagens de aniversário

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      teste_email:
        description: 'Só mandar um e-mail de teste para o próprio Gmail (não envia nada aos membros)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aniversarios

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji fonts-noto-core > /dev/null || true
      - run: npm install --no-save --no-audit --no-fund --no-package-lock web-push@3.6.7 nodemailer@6.10.1 @napi-rs/canvas@0.1.65
      - run: node robos/enviar-aniversarios.mjs
        env:
          SITE_URL: https://igreja-conecta.github.io/igreja-conecta
          ENVIO_SECRET: ${{ secrets.ENVIO_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          EMAIL_TEST: ${{ inputs.teste_email && '1' || '' }}
          GMAIL_USER: ${{ vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
