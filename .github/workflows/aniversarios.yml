name: Mensagens de aniversário

on:
  schedule:
    # 7h de Brasília (UTC-3). O GitHub às vezes atrasa alguns minutos.
    # Rodar todo dia também mantém o projeto gratuito do Supabase acordado.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aniversarios

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save --no-audit --no-fund --no-package-lock web-push@3.6.7
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node scripts/enviar-aniversarios.mjs
        env:
          SITE_URL: https://igreja-conecta.github.io/igreja-conecta
          ENVIO_SECRET: ${{ secrets.ENVIO_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # E-mail: fica desligado até existir um domínio próprio no Resend.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
