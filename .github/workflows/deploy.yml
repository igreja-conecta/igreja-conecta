name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Atualiza nome e ícone das igrejas (pastas i/<igreja>/) que mudaram na configuração
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Mudança de código: testa no Android, no iPhone, as regras do banco e as funções do app.
  # Roda na imagem oficial do Playwright, que já traz os navegadores (sem instalar nada na hora).
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm install --no-audit --no-fund
      - run: npx playwright test
        env:
          HOME: /root
          # Senha das contas de teste das igrejas Teste A e Teste B (scripts/criar-usuarios-de-teste.mjs)
          TEST_USERS_PASSWORD: ${{ secrets.TEST_USERS_PASSWORD }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-dos-testes
          path: playwright-report
          retention-days: 14

  # Publica só se os testes passaram (ou se foi só a atualização das igrejas, sem mudança de código).
  deploy:
    needs: test
    if: >-
      always() && github.event_name != 'pull_request' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@v6
      - run: node scripts/build-site.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
