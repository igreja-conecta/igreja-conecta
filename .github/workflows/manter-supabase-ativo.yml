# Mantém o projeto gratuito do Supabase ativo.
# O Supabase pausa projetos gratuitos depois de 7 dias sem atividade.
# Todo dia de madrugada o GitHub (na nuvem, sem depender de nenhum computador)
# faz uma consulta pequena ao banco usando só a chave pública (a mesma do js/config.js,
# que já está no site). As igrejas ativas são públicas: volta uma linha, e conta como atividade.
# Não depende do relógio do banco (pg_cron do 007_relogio): se o projeto pausar, aquele para junto.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 03:00 em Brasília
  workflow_dispatch:       # permite rodar na mão pela aba Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consultar o banco
        run: |
          curl -fsS --retry 3 --retry-delay 20 \
            "https://lmukzyonnggwwwjrfywy.supabase.co/rest/v1/churches?select=id&limit=1" \
            -H "apikey: sb_publishable_Z8-CR2iLvz9XAC59Dty-Vg_BOPcvDhC"
