<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Mesma regra do index.html; os 3 scripts desta página entram pela impressão digital (sha256).
       Se mudar um deles, rode de novo o cálculo (ver o PR de segurança). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-KyBpz1Nc7D06qowyR/PuXrss5VLa+Zf2nX+V1Su5AfE=' 'sha256-5UnOc62tn7J3RMNJlUZ2C7CrJQdbDk4e1y+5+ChLxlA=' 'sha256-nMkesqLERpKKFsnwTGMgsEMGhT8Y32fqeCMTDdweLkE=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://lmukzyonnggwwwjrfywy.supabase.co https://tile.openstreetmap.org; connect-src 'self' https://lmukzyonnggwwwjrfywy.supabase.co wss://lmukzyonnggwwwjrfywy.supabase.co https://nominatim.openstreetmap.org https://cdn.jsdelivr.net; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <script>
    // Igreja nova que ainda não ganhou a pasta i/<igreja>/ na publicação do site:
    // abre o app mesmo assim, apontando os arquivos para a raiz do site.
    (function () {
      var p = location.pathname;
      var m = p.match(/^(.*\/)i\/[a-z0-9]+(?:-[a-z0-9]+)*\/?$/);
      if (m) {
        document.write('<base href="' + m[1] + '">');
        window.__CHURCH_PAGE__ = true;
        return;
      }
      // Em usuario.github.io/repositorio/, o início é a pasta do repositório.
      var seg = location.hostname.endsWith('github.io') ? p.split('/')[1] : '';
      window.__HOME__ = seg ? '/' + seg + '/' : '/';
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="js/tema.js"></script>
  <title>Igreja Conecta</title>
  <meta name="theme-color" content="#3b5bdb">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <style>
    .not-found { font-family: system-ui, sans-serif; text-align: center; padding: 60px 16px; }
  </style>
  <script>
    if (window.__CHURCH_PAGE__) {
      document.write('<link rel="stylesheet" href="css/style.css"><script type="module" src="js/app.js"><\/script>');
    } else {
      document.write('<style>header, main, nav { display: none; }</style>');
    }
  </script>
</head>
<body>
  <script>
    if (!window.__CHURCH_PAGE__) {
      document.addEventListener('DOMContentLoaded', function () {
        document.body.innerHTML = '<div class="not-found"><h1>Página não encontrada</h1><p><a href="' + window.__HOME__ + '">Ir para o início</a></p></div>';
      });
    }
  </script>
  <header class="topbar">
    <a href="#/" class="brand">
      <img id="brand-logo" src="icons/icon-192.png" alt="" width="30" height="30">
      <span id="app-name">Igreja Conecta</span>
    </a>
    <div class="top-actions">
      <button type="button" id="theme-btn" class="notif-link theme-btn" aria-label="Trocar o tema"></button>
      <a href="#/chat" id="chat-link" class="notif-link" aria-label="Conversas" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 5.5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>
        <span id="chat-badge" class="notif-badge" hidden></span>
      </a>
      <a href="#/notificacoes" id="notif-link" class="notif-link" aria-label="Notificações" hidden>
        <svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
        <span id="notif-badge" class="notif-badge" hidden></span>
      </a>
      <a href="#/entrar" id="account-link" class="account-link">Entrar</a>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite">
    <div class="loading">Carregando…</div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Navegação principal" hidden></nav>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
